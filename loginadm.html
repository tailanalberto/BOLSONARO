<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REalimenta - Login Administrativo</title>

    <link rel="stylesheet" href="loginadm.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                <div class="logo-icon">R</div>

                <h1>REalimenta</h1>

                <p>Painel Administrativo</p>
            </div>

            <form id="loginForm">

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="senha-container">

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarSenha"
                        >
                            👁
                        </button>

                    </div>

                </div>

                <div class="opcoes">

                    <label>
                        <input
                            type="checkbox"
                            id="lembrar"
                        >

                        Lembrar de mim
                    </label>

                    <a href="#">
                        Esqueci minha senha
                    </a>

                </div>

                <button
                    type="submit"
                    class="btn-login"
                >
                    ENTRAR
                </button>

                <p id="mensagem"></p>

            </form>

        </div>

    </div>

    <script src="loginadm.js"></script>

</body>

</html>
